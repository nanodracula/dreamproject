# iOS uses Xcode's bundled toolchain. Add [tools] only as dependencies arrive.

[tasks."ios:build"]
description = "Build DreamApp for iOS Simulator"
run = "bash tools/run-ios.sh build"

[tasks."ios:run"]
description = "Build and launch DreamApp in iOS Simulator"
run = "bash tools/run-ios.sh run"

[tasks."ios:test"]
description = "Test DreamApp on an explicit iOS Simulator destination"
run = "bash tools/run-ios.sh test"

[tasks."git:commit"]
description = "Stage all changes and commit via Codex"
run = "codex exec \"stage all changes and commit\" --config 'model_reasoning_effort=\"low\"' --dangerously-bypass-approvals-and-sandbox"
